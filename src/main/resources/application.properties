spring.application.name=entrevista
spring.profiles.default=local
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY:}

# Documentacion de la API: Scalar como interfaz de referencia sobre el OpenAPI de springdoc
scalar.enabled=true
scalar.path=/scalar
scalar.url=/v3/api-docs
scalar.telemetry=false
