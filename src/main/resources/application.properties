spring.application.name=entrevista
spring.profiles.default=local
spring.config.import=optional:file:.env[.properties]

# Puerto HTTP. Cloud Run inyecta PORT y exige que el proceso escuche exactamente
# ahi; si no, el contenedor no arranca. El encadenamiento conserva el comportamiento
# local: sin PORT usa SERVER_PORT, y sin ninguno de los dos, 8080.
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
# El esquema lo instala Flyway en todos los perfiles; Hibernate solo comprueba que el mapeo coincide.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=microentrevista
spring.flyway.schemas=microentrevista
spring.flyway.default-schema=microentrevista
spring.flyway.create-schemas=true
# Fuerza UTF-8 también en las respuestas de error (ASVS 4.1.1).
spring.servlet.encoding.force-response=true

# Modelo de lenguaje (Gemini con Spring AI). La llave y el modelo son obligatorios y sin valor
# por defecto: si faltan, el servicio no arranca (el perfil local trae una llave falsa). Una
# llamada hace un solo intento y espera como maximo LLM_TIMEOUT. La temperatura (1.0, la del
# modelo) y el nivel de pensamiento (low) son decisiones de la spec de CM-312, no del ambiente.
# gemini-3.8-flash no acepta minimal (responde 400); low es el nivel mas bajo que admite (PD-04).
cameia.llm.api-key=${GOOGLE_GENAI_API_KEY:}
cameia.llm.model=${LLM_MODEL:}
cameia.llm.timeout=${LLM_TIMEOUT:30s}
cameia.llm.temperature=1.0
cameia.llm.thinking-level=low

# Documentacion de la API: Swagger UI como interfaz de referencia sobre el OpenAPI de springdoc.
# El interruptor API_DOCS_ENABLED publica o retira a la vez el JSON y la interfaz: servir
# uno sin el otro deja el contrato expuesto. Su valor por defecto lo fija cada perfil
# (local lo activa, production lo desactiva); aqui queda apagado para que un perfil nuevo
# nunca publique el contrato sin decidirlo de forma explicita.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
