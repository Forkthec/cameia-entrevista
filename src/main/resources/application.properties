spring.application.name=entrevista
spring.profiles.default=local
spring.config.import=optional:file:.env[.properties]

# Puerto HTTP. Cloud Run inyecta PORT y exige que el proceso escuche exactamente
# ahi; si no, el contenedor no arranca. El encadenamiento conserva el comportamiento
# local: sin PORT usa SERVER_PORT, y sin ninguno de los dos, 8080.
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Con la base caída, la petición falla con el error controlado a los 5 s y no a los 30 s del valor por defecto,
# para no dejar hilos ocupados esperando una conexión que no llega.
spring.datasource.hikari.connection-timeout=5000

spring.jpa.open-in-view=false
# El esquema lo instala Flyway en todos los perfiles; Hibernate solo comprueba que el mapeo coincide.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=microentrevista
spring.flyway.schemas=microentrevista
spring.flyway.default-schema=microentrevista
spring.flyway.create-schemas=true
# Fuerza UTF-8 también en las respuestas de error (ASVS 4.1.1).
spring.servlet.encoding.force-response=true

# Modelo de lenguaje (Gemini con Spring AI). La llave y el modelo son obligatorios y sin valor
# por defecto: si faltan, el servicio no arranca (el perfil local trae una llave falsa). Una
# llamada hace un solo intento y espera como maximo LLM_TIMEOUT (20 s por defecto: medido para
# planificar las preguntas). La temperatura (1.0, la del modelo) y el nivel de pensamiento
# (minimal) no dependen del ambiente. El modelo configurado en LLM_MODEL debe admitir minimal:
# gemini-3.5-flash-lite lo admite; gemini-3.8-flash responde 400 y exige low como minimo.
cameia.llm.api-key=${GOOGLE_GENAI_API_KEY:}
cameia.llm.model=${LLM_MODEL:}
cameia.llm.timeout=${LLM_TIMEOUT:20000ms}
cameia.llm.temperature=1.0
cameia.llm.thinking-level=minimal

# Documentacion de la API: Swagger UI como interfaz de referencia sobre el OpenAPI de springdoc.
# El interruptor API_DOCS_ENABLED publica o retira a la vez el JSON y la interfaz: servir
# uno sin el otro deja el contrato expuesto. Su valor por defecto lo fija cada perfil
# (local lo activa, production lo desactiva); aqui queda apagado para que un perfil nuevo
# nunca publique el contrato sin decidirlo de forma explicita.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs

# Registro: cada linea lleva el requestId de la peticion que la origino (lo pone RequestIdFilter en
# el MDC); fuera de una peticion, como al arrancar, los corchetes quedan vacios.
logging.pattern.level=%5p [%X{requestId:-}]

# Mensajeria (consumidores de los eventos de Perfil). La direccion del broker llega en
# SPRING_RABBITMQ_ADDRESSES (la monta el despliegue desde un secreto), sin valor por defecto.
# Mismos valores que Perfil: un mensaje se intenta 3 veces (1 s y 2 s de espera) y, agotado,
# va a la cola de fallidos; nunca vuelve a su cola.
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=2s

# Servicio de Voz: transcribe el audio de las respuestas (HU-5.12 y HU-5.13). Cada intento espera como maximo
# VOZ_TIMEOUT (60 s); un error transitorio del primero (503 o conexion rechazada) se reintenta una sola vez tras
# VOZ_RETRY_PAUSE. El contrato con Voz es provisional: ver specs/CM-362-ReintentoTranscripcionAudio.
cameia.voz.base-url=${VOZ_BASE_URL:http://localhost:8090}
cameia.voz.timeout=${VOZ_TIMEOUT:60s}
cameia.voz.connect-timeout=${VOZ_CONNECT_TIMEOUT:5s}
cameia.voz.retry-pause=${VOZ_RETRY_PAUSE:1s}

# Audio de las respuestas: hasta 10 MB y siempre en memoria (umbral igual al limite), para que el archivo nunca se
# escriba en disco y se descarte al terminar la peticion (CA-5.13.4).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=10MB
