spring.application.name=entrevista
spring.profiles.default=local
spring.config.import=optional:file:.env[.properties]

# Puerto HTTP. Cloud Run inyecta PORT y exige que el proceso escuche exactamente
# ahi; si no, el contenedor no arranca. El encadenamiento conserva el comportamiento
# local: sin PORT usa SERVER_PORT, y sin ninguno de los dos, 8080.
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Con la base caída, la petición falla con el error controlado a los 5 s y no a los 30 s del valor por defecto,
# para no dejar hilos ocupados esperando una conexión que no llega.
spring.datasource.hikari.connection-timeout=5000

spring.jpa.open-in-view=false
# El esquema lo instala Flyway en todos los perfiles; Hibernate solo comprueba que el mapeo coincide.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=microentrevista
spring.flyway.schemas=microentrevista
spring.flyway.default-schema=microentrevista
spring.flyway.create-schemas=true
# Fuerza UTF-8 también en las respuestas de error (ASVS 4.1.1).
spring.servlet.encoding.force-response=true

# Modelo de lenguaje (Gemini con Spring AI). La llave y el modelo son obligatorios y sin valor
# por defecto: si faltan, el servicio no arranca (el perfil local trae una llave falsa). Una
# llamada hace un solo intento y espera como maximo LLM_TIMEOUT (20 s por defecto: medido para
# planificar las preguntas). La temperatura (1.0, la del modelo) y el nivel de pensamiento
# (minimal) no dependen del ambiente. El modelo configurado en LLM_MODEL debe admitir minimal:
# gemini-3.5-flash-lite lo admite; gemini-3.8-flash responde 400 y exige low como minimo.
cameia.llm.api-key=${GOOGLE_GENAI_API_KEY:}
cameia.llm.model=${LLM_MODEL:}
cameia.llm.timeout=${LLM_TIMEOUT:20000ms}
cameia.llm.temperature=1.0
cameia.llm.thinking-level=minimal

# Multipart de la respuesta por voz. El audio admite hasta 10 MiB (10485760 bytes): el limite de la parte queda
# en 12 MiB para que un archivo de 10485761 bytes llegue al caso de uso y reciba su propio mensaje (AUDIO_TOO_LARGE);
# por encima de 12 MiB responde el contenedor (REQUEST_PAYLOAD_TOO_LARGE). El umbral de escritura en disco supera el
# limite: las partes viven solo en memoria y el audio nunca toca el disco (CA-5.8.18).
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
spring.servlet.multipart.file-size-threshold=13MB
# Reintentos y respaldo de la IA: cada operacion hace hasta 3 intentos (2 con Gemini y el tercero con
# Qwen en Groq). La evaluacion espera como maximo LLM_EVALUATION_TIMEOUT por intento y la planificacion
# LLM_TIMEOUT. Entre un intento y el siguiente se espera LLM_RETRY_FIRST_WAIT y despues
# LLM_RETRY_SECOND_WAIT. Sin GROQ_API_KEY el servicio arranca y el tercer intento usa Gemini.
cameia.llm.evaluation-timeout=${LLM_EVALUATION_TIMEOUT:3000ms}
cameia.llm.retry.first-wait=${LLM_RETRY_FIRST_WAIT:500ms}
cameia.llm.retry.second-wait=${LLM_RETRY_SECOND_WAIT:1000ms}
cameia.llm.fallback.api-key=${GROQ_API_KEY:}
cameia.llm.fallback.model=${LLM_FALLBACK_MODEL:qwen/qwen3.8-27b}
cameia.llm.fallback.base-url=${LLM_FALLBACK_BASE_URL:https://api.groq.com/openai}

# Los modelos de chat (Gemini y Groq) los arma LanguageModelConfiguration: la autoconfiguracion de
# Spring AI no crea ninguno, ni los demas modelos del starter de OpenAI, que no se usan.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Documentacion de la API: Swagger UI como interfaz de referencia sobre el OpenAPI de springdoc.
# El interruptor API_DOCS_ENABLED publica o retira a la vez el JSON y la interfaz: servir
# uno sin el otro deja el contrato expuesto. Su valor por defecto lo fija cada perfil
# (local lo activa, production lo desactiva); aqui queda apagado para que un perfil nuevo
# nunca publique el contrato sin decidirlo de forma explicita.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs

# Registro: cada linea lleva el requestId de la peticion que la origino (lo pone RequestIdFilter en
# el MDC); fuera de una peticion, como al arrancar, los corchetes quedan vacios.
logging.pattern.level=%5p [%X{requestId:-}]

# Mensajeria (consumidores de los eventos de Perfil). La direccion del broker llega en
# SPRING_RABBITMQ_ADDRESSES (la monta el despliegue desde un secreto), sin valor por defecto.
# Mismos valores que Perfil: un mensaje se intenta 3 veces (1 s y 2 s de espera) y, agotado,
# va a la cola de fallidos; nunca vuelve a su cola.
spring.rabbitmq.connection-timeout=2s
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=2s
# Transcripcion con AssemblyAI. Sin ASSEMBLYAI_API_KEY el servicio arranca y cada respuesta por voz responde
# 503 TRANSCRIPTION_UNAVAILABLE. TRANSCRIPTION_TIMEOUT cubre subida, encolado y espera de un intento, por debajo de los 120 s
# del Gateway. El umbral de idioma es la confianza minima para rechazar un audio en otro idioma (CA-5.12.10).
cameia.transcription.api-key=${ASSEMBLYAI_API_KEY:}
cameia.transcription.base-url=${ASSEMBLYAI_BASE_URL:https://api.assemblyai.com}
cameia.transcription.speech-models=${ASSEMBLYAI_SPEECH_MODELS:universal-3-5-pro,universal-2}
cameia.transcription.timeout=${TRANSCRIPTION_TIMEOUT:60s}
# Reintento automatico (CM-362, HU-5.13): un 503 o una conexion rechazada del primer intento se reintenta una vez
# tras TRANSCRIPTION_RETRY_PAUSE; un intento que agota TRANSCRIPTION_TIMEOUT (60 s, CA-5.13.3) no se reintenta. El
# reintento solo ocurre si cabe entero en TRANSCRIPTION_TOTAL_BUDGET (100 s: sumado a la evaluacion queda por debajo de los 120 s del Gateway).
cameia.transcription.retry-pause=${TRANSCRIPTION_RETRY_PAUSE:1s}
cameia.transcription.total-budget=${TRANSCRIPTION_TOTAL_BUDGET:100s}
cameia.transcription.poll-interval=${TRANSCRIPTION_POLL_INTERVAL:1s}
cameia.transcription.language-confidence-threshold=${TRANSCRIPTION_LANGUAGE_CONFIDENCE_THRESHOLD:0.8}
