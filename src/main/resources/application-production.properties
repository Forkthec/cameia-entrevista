spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Documentacion de la API retirada en despliegue: ni /v3/api-docs ni /swagger-ui.html
# responden. API_DOCS_ENABLED=true la reactiva de forma temporal y deliberada.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
