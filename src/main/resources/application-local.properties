spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Documentacion de la API activada en desarrollo. API_DOCS_ENABLED=false la apaga.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

# Llave falsa por defecto: el servicio arranca sin secretos reales. Una llamada al modelo con
# ella falla con LLM_UNAVAILABLE; para llamar de verdad se define GOOGLE_GENAI_API_KEY.
cameia.llm.api-key=${GOOGLE_GENAI_API_KEY:local-fake-key}
